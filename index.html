<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Results Summary </title>
  <link rel="stylesheet" href="index.css">

</head>
<body>
  <div class="container">
    <div class="result">
      <h3>Your Result</h3>
      <div class="circle">
        <h1>76</h1>
        <p>of 100</p>
      </div>

      <div class="result-text">
        <h2>Great</h2>
        <p>You scored higher than 65% of the people who have taken these tests</p>
      </div>
    </div>

  <section class="summary">
        <h3>Summary</h3>

        <div class="score reaction">
          <img class="icon" src="icon-reaction.svg">
              <span>Reaction</span>
              <p>80 <span>/ 100 </span></p>
        </div>

        <div class="score memory">
          <img class="icon" src="icon-memory.svg">
              <span>Memory</span>
              <p>92 <span>/ 100</span></p>
        </div>

        <div class="score verbal">
          <img class="icon" src="icon-verbal.svg">
              <span>Verbal</span>
                <p> 61 <span>/ 100 </span> </p>
        </div>

        <div class="score visual">
          <img class="icon" src="icon-visual.svg">
              <span>Visual</span>
              <p> 73<span>/ 100 </span> </p>
        </div>

        <button>Continue</button>

    </section>

</div>
</body>
</html>
